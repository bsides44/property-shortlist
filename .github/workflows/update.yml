name: Update Nelson shortlist

# Runs once a day: crawl realestate.co.nz for qualifying Nelson houses, enrich
# each with hazard / age / renovation data, rebuild the viewer, and commit the
# result. One short run a day is far under the free Actions allowance (public
# repos are unmetered; private repos get 2,000 min/month and this uses ~5-15).

on:
  schedule:
    - cron: "0 18 * * *"     # 18:00 UTC ≈ 6am NZ
  workflow_dispatch:          # allow manual runs from the Actions tab

# don't let two runs overlap
concurrency:
  group: update-shortlist
  cancel-in-progress: false

permissions:
  contents: write             # to commit the refreshed data + HTML

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CRAWL_MAX_NEW: "40"     # new listings enriched per run (politeness cap)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl + enrich (updates data.json)
        run: python3 crawl.py

      - name: Rebuild viewer (index.html)
        run: python3 build_html.py

      - name: Commit if changed
        run: |
          git config user.name  "shortlist-bot"
          git config user.email "shortlist-bot@users.noreply.github.com"
          git add data.json index.html nelson_shortlist.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-update Nelson shortlist ($(date -u +%Y-%m-%d))"
            git push
          fi
